  <style>
    :root {
      --iron: #16191d;
      --iron-light: #22272e;
      --bronze: #b87d4b;
      --bronze-dark: #8f5d32;
      --bronze-soft: #f7f1eb;
      --stone: #f4f3ef;
      --surface: #ffffff;
      --border: #dcd9d0;
      --text-main: #1e2229;
      --text-muted: #5c6370;
      --green: #1b7a43;
      --green-bg: #e7f5ed;
      --crimson: #9e2a2b;
      --crimson-bg: #fbeaea;
      --amber: #b45309;
      --amber-bg: #fef3c7;
      --blue: #255799;
    }

    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--stone); color: var(--text-main); }

    /* ================= CABEÇALHO ESPARTANO ================= */
    .hero-header {
      background-color: var(--iron);
      background-image:
        linear-gradient(to bottom,
          rgba(22, 25, 29, 0.45) 0%,
          rgba(22, 25, 29, 0.72) 55%,
          #16191d 100%),
        url('./banner.png');
      background-position: center 20%;
      background-size: cover;
      background-repeat: no-repeat;
      text-align: center;
      position: relative;
      width: 100%;
      border-bottom: 4px solid var(--bronze);
      padding: 48px 20px 42px 20px;
    }

    .hero-emblem {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--bronze);
      border: 1px solid rgba(184, 125, 75, 0.45);
      background: rgba(22, 25, 29, 0.8);
      padding: 5px 16px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .hero-brand-title {
      font-family: 'Cinzel', serif;
      color: #ffffff;
      font-size: clamp(28px, 4.5vw, 44px);
      font-weight: 800;
      margin: 0 0 4px 0;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.85);
    }

    .hero-brand-title span { color: var(--bronze); }

    .hero-brand-sub {
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .hero-date-display {
      display: inline-block;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(34, 39, 46, 0.85);
      border: 1px solid rgba(184, 125, 75, 0.5);
      padding: 7px 20px;
      border-radius: 4px;
      margin-bottom: 14px;
    }

    /* Bloco do Versículo Dinâmico */
    .hero-verse-box {
      max-width: 720px;
      margin: 0 auto;
      background: rgba(22, 25, 29, 0.78);
      border-left: 3px solid var(--bronze);
      border-right: 3px solid var(--bronze);
      padding: 14px 20px;
      border-radius: 6px;
      backdrop-filter: blur(6px);
    }

    .hero-verse-box p {
      margin: 0 0 8px 0;
      font-family: 'Cinzel', serif;
      font-size: 14.5px;
      line-height: 1.55;
      color: #f1f5f9;
      font-weight: 600;
    }

    .hero-verse-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-verse-box span {
      font-size: 12px;
      color: var(--bronze);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-refresh-verse {
      background: transparent;
      border: 1px solid rgba(184, 125, 75, 0.45);
      color: #cbd5e1;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-refresh-verse:hover { background: var(--bronze); color: var(--iron); }

    /* Botão Liderança */
    .btn-lider {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(22, 25, 29, 0.82);
      color: #f8fafc;
      border: 1px solid var(--bronze);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.25s;
      z-index: 10;
    }
    .btn-lider:hover { background: var(--bronze); color: var(--iron); }

    /* ================= BARRA PÚBLICA & CONTAGEM ================= */
    .info-evento-publico {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 22px 20px;
      text-align: center;
    }

    .countdown { display: flex; justify-content: center; gap: 12px; margin: 12px 0; }
    .cd-box {
      background: var(--iron);
      color: var(--bronze);
      padding: 10px 12px;
      border-radius: 6px;
      min-width: 64px;
      border-bottom: 3px solid var(--bronze);
    }
    .cd-box span { display: block; font-family: 'Cinzel', serif; font-size: 24px; font-weight: 700; }
    .cd-box small { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; }

    .valor-ingresso { font-size: 18px; color: var(--iron); font-weight: 700; margin-top: 10px; }
    .sub-valor-ingresso { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

    .public-actions-bar { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

    /* ================= CONTAINER PRINCIPAL ================= */
    .container {
      max-width: 980px;
      margin: 22px auto 40px auto;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 6px 24px rgba(22, 25, 29, 0.06);
      overflow: hidden;
    }

    /* ================= BARRA DE BIOMETRIA DA LIDERANÇA NO PAINEL ================= */
    .lider-bio-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #fdfbf7;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }

    /* ================= ABAS DE NAVEGAÇÃO DO PAINEL ================= */
    .admin-tabs-bar {
      display: flex;
      background: var(--iron);
      border-bottom: 2px solid var(--bronze);
      overflow-x: auto;
    }
    .admin-tab-btn {
      flex: 1;
      min-width: 140px;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      border-right: 1px solid rgba(255,255,255,0.08);
      transition: 0.2s;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .admin-tab-btn:hover { color: #fff; background: rgba(255,255,255,0.04); }
    .admin-tab-btn.active { background: var(--bronze); color: var(--iron); }

    .admin-tab-panel { display: none; padding: 22px 20px; background: #faf9f6; }
    .admin-tab-panel.active { display: block; }

    /* Dashboard */
    .dashboard { display: none; }
    .dashboard.active { display: block; }

      border: 1px solid #f5c2c2;
